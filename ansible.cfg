[defaults]
localhost_warning = False
callback_result_format = yaml
log_path = ansible.log

[privilege_escalation]
# Ubuntu 26.04's sudo (sudo-rs) changes the password prompt, Ansible doesn't recognize
# it and times out. The classic sudo still ships as sudo.ws.
# https://bugs.launchpad.net/ubuntu/+source/ansible-core/+bug/2122414
become_exe = sudo.ws

[inventory]
inventory_unparsed_warning = False
