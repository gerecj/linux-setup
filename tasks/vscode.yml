---
# From Microsoft's apt repository, https://code.visualstudio.com/docs/setup/linux
# The code package manages this repo itself unless told not to: on every upgrade the
# old version's postrm deletes vscode.sources (ours too), then the new one asks to
# add its own. Answering "no" up front makes its scripts leave the repo alone.
- name: Keep the VS Code package from managing its apt repository
  ansible.builtin.debconf:
    name: code
    question: code/add-microsoft-repo
    vtype: boolean
    value: "false"

- name: Download the Microsoft signing key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
    force: true # fetch it every run, so a renewed key gets picked up

- name: Add the VS Code repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/microsoft.asc
    dest: /etc/apt/sources.list.d/vscode.sources
    mode: "0644"
  register: vscode_repo

- name: Install VS Code
  ansible.builtin.apt:
    name: code
    update_cache: "{{ vscode_repo is changed }}"
  # --check doesn't write the repo file, so the package can't be found yet
  when: not (ansible_check_mode and vscode_repo is changed)
