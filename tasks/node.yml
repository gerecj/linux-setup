---
# fnm's official installer, same as `curl -fsSL https://fnm.vercel.app/install | bash`,
# then the current LTS Node.js. For the user running the playbook: fnm lives in
# ~/.local/share/fnm and the installer hooks it into ~/.bashrc.
- name: Download the fnm installer
  ansible.builtin.uri:
    url: https://fnm.vercel.app/install
    return_content: true
  register: fnm_installer
  check_mode: false # only reads, so it's fine to run with --check too

# Only once, the installer appends to ~/.bashrc every time it runs
- name: Run the fnm installer
  ansible.builtin.command: bash -s
  args:
    stdin: "{{ fnm_installer.content }}"
    creates: ~/.local/share/fnm/fnm

# The first version fnm installs becomes the default
- name: Install the current LTS Node.js
  ansible.builtin.command: ~/.local/share/fnm/fnm install --lts
  args:
    creates: ~/.local/share/fnm/aliases/default

# ~/.bashrc returns early in non-interactive shells, so agents (e.g. started by T3
# Code) wouldn't find node. At the top of ~/.profile, before it loads ~/.bashrc,
# where `fnm env` puts the per-project version in front again.
- name: Put the default Node.js on PATH in ~/.profile
  ansible.builtin.blockinfile:
    path: ~/.profile
    marker: "# {mark} fnm default Node.js, for non-interactive shells (linux-setup)"
    insertbefore: BOF
    block: |
      PATH="$HOME/.local/share/fnm/aliases/default/bin:$PATH"
