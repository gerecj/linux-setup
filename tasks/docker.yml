---
# From Docker's apt repository, https://docs.docker.com/engine/install/ubuntu/
- name: Download the Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true # fetch it every run, so a renewed key gets picked up

- name: Add the Docker repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  register: docker_repo

- name: Install Docker
  # --check doesn't write the repo file, so the packages can't be found yet
  when: not (ansible_check_mode and docker_repo is changed)
  block:
    - name: Install the Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: "{{ docker_repo is changed }}"

    # Being in the docker group is effectively root access, the usual trade-off on a
    # personal dev machine. It takes effect at the next login.
    - name: Let the user running the playbook use Docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        groups: docker
        append: true
