---
# KDE Plasma for when a monitor is plugged in. The machine still boots to the console,
# the login screen (SDDM) only starts with `sudo systemctl start display-manager`.
- name: Install KDE Plasma
  ansible.builtin.apt:
    name:
      - kde-plasma-desktop
      - sddm-theme-breeze
    install_recommends: true

- name: Create the SDDM config directory
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    mode: "0755"

- name: Use the Breeze login screen theme
  ansible.builtin.copy:
    content: |
      [Theme]
      Current=breeze
    dest: /etc/sddm.conf.d/breeze.conf
    mode: "0644"

- name: Let NetworkManager manage the network
  ansible.builtin.copy:
    content: |
      # Let NetworkManager manage all devices on this system
      network:
        version: 2
        renderer: NetworkManager
    dest: /etc/netplan/01-network-manager-all.yaml
    mode: "0600"
  notify: Apply the network config

- name: Turn off systemd-networkd
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop:
    - systemd-networkd.service
    - systemd-networkd.socket
    - systemd-networkd-wait-online.service

# Same as `systemctl set-default multi-user.target`. Ubuntu defaults to
# graphical.target, which would start SDDM on every boot now that it's installed.
- name: Boot to the console
  ansible.builtin.file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
